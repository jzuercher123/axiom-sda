services:
  axiom-core:
    image: ${AXIOM_CORE_IMAGE:-axiom-core}:${AXIOM_CORE_TAG:-1.0.0}
    build:
      context: ${AXIOM_KERNEL_PATH:-../axiom_kernel}
      dockerfile: Dockerfile
    container_name: axiom-core
    restart: unless-stopped
    volumes:
      - ${AXIOM_DATA_DIR:-./data}:/data
    networks:
      - axiom-net

  axiom-agents:
    image: ${AXIOM_AGENTS_IMAGE:-axiom-agents}:${AXIOM_AGENTS_TAG:-1.0.0}
    build:
      context: ${AXIOM_AGENTS_PATH:-../axiom_agents}
      dockerfile: Dockerfile
    container_name: axiom-agents
    restart: unless-stopped
    depends_on:
      - axiom-core
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ZMQ_CORE_ENDPOINT=tcp://axiom-core:5555
      - ZMQ_UI_PUB_ENDPOINT=tcp://*:5556
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ${AXIOM_DATA_DIR:-./data}:/data
    networks:
      - axiom-net

  axiom-sda:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: axiom-sda
    restart: unless-stopped
    depends_on:
      - axiom-agents
    ports:
      - "8000:8000"
    environment:
      - AXIOM_DATA_DIR=/data
      - ZMQ_AGENT_SUB_ENDPOINT=tcp://axiom-agents:5556
    volumes:
      - ${AXIOM_DATA_DIR:-./data}:/data
    networks:
      - axiom-net

networks:
  axiom-net:
    driver: bridge